name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: task*/requirements.txt

      - name: Install every task's requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r task1/requirements.txt -r task2/requirements.txt \
                                -r task3/requirements.txt -r task4/requirements.txt

      # All four suites are offline: no API key, no network beyond localhost.
      - name: Run all test suites
        run: python run_tests.py

      # Task 2's transcript demo is self-checking (12 scenarios) and needs no key.
      - name: Task 2 transcript smoke test
        working-directory: task2
        run: python demo_transcript.py --stdout > /dev/null
